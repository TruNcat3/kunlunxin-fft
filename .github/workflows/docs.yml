name: Documentation

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install -r requirements-docs.txt
      - name: Run hardware-independent tests
        run: pytest -q
      - name: Check shell syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
      - name: Check generated release figure
        run: |
          python scripts/plot_release_docs.py
          git diff --exit-code -- \
            docs/assets/figures/release-overview.png \
            docs/assets/figures/release-overview.svg
      - run: mkdocs build --strict
      - name: Check deployed links and assets
        run: python scripts/check_docs_assets.py site --site-prefix /kunlunxin-fft/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
