[pytest]
testpaths = tests
# The default `pytest -q` gate is host-only: hardware tests must never be
# collected on a machine without a healthy XPU (CUDA init on a broken card
# hangs the session). Device runs opt in explicitly with `pytest -q -m
# hardware` (CLI -m overrides this addopts default).
addopts = -m "not hardware"
markers =
    hardware: requires the vendor xpytorch stack and a reachable P800 XPU
